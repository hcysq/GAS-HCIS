<script>
const root = document.getElementById('root');
const nav = document.getElementById('nav');
const btnLogout = document.getElementById('btnLogout');

let state = {
  me: null,
  route: 'login',
};

function isAuthed(){ return !!(state.me && state.me.ok); }

function goto(route){
  if (!isAuthed()){
    state.route='login';
    renderLogin();
    return;
  }
  state.route = route || 'dash';
  renderAppShell();
  setActiveTab(state.route);
  renderRoute(state.route);
}

function boot(){
  google.script.run.withSuccessHandler(res=>{
    if(!res || !res.ok){
      state.me=null;
      state.route='login';
      renderLogin();
      return;
    }
    state.me=res;
    goto('dash');
  }).authMe();
}

/* ===================== LOGIN ===================== */
function renderLogin(msg=''){
  nav.classList.add('hidden');
  btnLogout.classList.add('hidden');

  root.innerHTML=`
    <div class="card">
      <div style="font-size:18px;font-weight:900;margin-bottom:6px;">Masuk HCIS</div>
      <div class="muted" style="margin-bottom:12px;">Login menggunakan <b>NIP</b> dan <b>Password</b>.</div>

      ${msg ? `<div class="muted" style="color:#ffb4b4;margin-bottom:10px;">${escapeHtml(msg)}</div>` : ''}

      <div style="margin-bottom:10px;">
        <input id="nip" placeholder="NIP" autocomplete="username">
      </div>

      <div style="margin-bottom:12px;">
        <div class="input-wrap">
          <input id="pin" type="password" placeholder="Password" autocomplete="current-password">
          <button type="button" class="peek-btn" onclick="togglePassword('pin', this)" aria-label="Tampilkan password">
            👁️
          </button>
        </div>
      </div>

      <button class="btn primary" onclick="login()">Masuk</button>
      <div class="muted" style="margin-top:12px;">Jika lupa password, hubungi Admin HC.</div>
    </div>
  `;

  // Optional: enter to submit
  setTimeout(()=>{
    const pin = document.getElementById('pin');
    if(pin){
      pin.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter') login();
      });
    }
  }, 0);
}

function renderAppShell(){
  nav.classList.remove('hidden');
  btnLogout.classList.remove('hidden');
}

/* ===================== ROUTES ===================== */
function renderRoute(route){
  if(!isAuthed()) return renderLogin();

  if(route==='dash') return renderDashboard();
  if(route==='profil') return renderProfil();
  if(route==='settings'){
    if (typeof settingsResetState_ === 'function') settingsResetState_();
    return renderSettings(); // <- dari settings.html
  }

  // placeholders modul
  if(route==='projects') return renderPlaceholder_('Progres Proyek');
  if(route==='absensi') return renderPlaceholder_('Absensi');
  if(route==='welfare') return renderWelfare();
  if(route==='development') return renderPlaceholder_('Pengembangan');

  return renderDashboard();
}

/* ===================== DASHBOARD ===================== */
function renderDashboard(){
  const me = state.me;

  root.innerHTML=`
    <div class="card">
      <div style="font-weight:900;font-size:18px;">Assalamu'alaikum, ${escapeHtml(me.nama||me.nip)}</div>
      <div class="muted" style="margin-top:4px;">
        NIP: <b>${escapeHtml(me.nip)}</b> • Role: <b>${escapeHtml(me.role)}</b>
      </div>
      <div class="muted" style="margin-top:6px;">
        <span id="dashUnit">Unit: …</span> • <span id="dashJabatan">Jabatan: …</span>
      </div>
    </div>

    <div class="card">
      <div style="font-weight:900;margin-bottom:10px;">Fitur HCIS</div>

      <div class="tileGrid">
        <div class="tile" onclick="goto('projects')">
          <div class="tileIcon">📌</div>
          <div>
            <div class="tileTitle">Progres Proyek</div>
            <div class="tileDesc">Program, milestone, task, laporan pekanan.</div>

        </div>

          <div class="tileIcon">🗓️</div>

            <div class="tileDesc">Jadwal pekanan, hadir, lembur, cuti & izin.</div>
          </div>
        </div>

        <div class="tile" onclick="goto('welfare')">
          <div class="tileIcon">💳</div>
          <div>
            <div class="tileTitle">Kesejahteraan</div>
            <div class="tileDesc">Slip gaji, klaim, reimbursement, pinjaman.</div>
          </div>
        </div>

        <div class="tile" onclick="goto('development')">
          <div class="tileIcon">🎓</div>
          <div>
            <div class="tileTitle">Pengembangan</div>
            <div class="tileDesc">Onboarding, kinerja, LMS, psikotes.</div>
          </div>
        </div>
      </div>

      <div class="muted" style="margin-top:12px;">
        Catatan: detail tiap fitur akan kita isi bertahap setelah CORE stabil.
      </div>
    </div>
  `;

  // Ambil unit/jabatan dengan struktur data yang sama seperti di Profil tab
  google.script.run.withSuccessHandler(res=>{
    if(!res || !res.ok || !res.data) return;
    const d = res.data;
    const unit = escapeHtml(d.summary?.unit || '-');
    const jabatan = escapeHtml(d.summary?.jabatan || '-');
    const elUnit = document.getElementById('dashUnit');
    const elJab = document.getElementById('dashJabatan');
    if (elUnit) elUnit.innerHTML = `Unit: <b>${unit}</b>`;
    if (elJab)  elJab.innerHTML  = `Jabatan: <b>${jabatan}</b>`;
  }).getProfilUsersDetail();
}


/* ===================== PROFIL BARU ===================== */
function renderProfil(){
  root.innerHTML = '<div class="card"><div class="muted">Memuat profil lengkap...</div></div>';

  google.script.run
    .withSuccessHandler(res => {
      if(!res || !res.ok || !res.data) {
        const msg = escapeHtml(res?.msg || 'Profil tidak dapat dimuat.');
        root.innerHTML = `
          <div class="card">
            <div style="color:#c0392b;font-weight:800;">Gagal memuat profil</div>
            <div class="muted" style="margin-top:6px;">${msg}</div>
            <div class="muted" style="margin-top:6px;">Data belum tersedia dari hasil pencarian USER_ID dan NIP sesi Anda.</div>
          </div>
        `;
        return;
      }

      const payload = buildProfilPayload_(res.data);
      renderProfilLayout_(payload);
    })
    .getProfilUsersDetail();
}

function buildProfilPayload_(raw){
  // Raw data dari buildStructuredProfile_() sudah dalam format yang benar
  // Cukup return langsung tanpa re-mapping
  return raw;
}

function normalizeEduFormal_(val){
  const arr = parseEduArray_(val);
  return arr.map(x => ({
    level: x.level || x.jenjang || x.tingkat || '-',
    nama: x.nama || x.sekolah || x.institusi || '-',
    jur: x.jur || x.jurusan || '',
    thn: x.thn || x.tahun || x.year || '',
    link: x.link || x.url || x.ijazah || ''
  }));
}

function normalizeEduNonFormal_(val){
  const arr = parseEduArray_(val);
  return arr.map(x => ({
    nama: x.nama || x.pelatihan || x.program || '-',
    thn: x.thn || x.tahun || x.year || '',
    link: x.link || x.url || x.sertifikat || ''
  }));
}

function parseEduArray_(val){
  if (Array.isArray(val)) return val.filter(Boolean);
  if (typeof val === 'string' && val.trim()){
    try{
      const parsed = JSON.parse(val);
      if (Array.isArray(parsed)) return parsed.filter(Boolean);
    }catch(e){ /* ignore */ }
  }
  return [];
}

function formatDateReadable_(val){
  try{
    if(!val) return '';
    const dt = new Date(val);
    if (isNaN(dt)) return String(val || '');
    return dt.toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' });
  }catch(e){
    return String(val || '');
  }
}

          ${item('NIK', d.personal.nik ? escapeHtml(maskNIK_(d.personal.nik)) : fallbackNotice, 'NIK')}

          ${itemReadonly('Jenis Kelamin', escapeHtml(d.personal.jenis_kelamin || '-'))}

/* ===================== UTILS ===================== */
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"'`=\/]/g, s => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',
    "'":'&#39;','`':'&#x60;','=':'&#x3D;','/':'&#x2F;'
  }[s]));
}
function kv(label, value){
  return `
    <div style="display:flex;gap:10px;align-items:flex-start;margin:8px 0;">
      <div style="flex:0 0 160px;max-width:160px;" class="muted">${escapeHtml(label)}</div>
      <div style="flex:1;font-weight:800;color:rgba(255,255,255,.92);">${escapeHtml(value ?? '-')}</div>
    </div>
  `;
}
function pick_(obj, keys){
  for (const k of keys){
    if (obj && Object.prototype.hasOwnProperty.call(obj, k)){
      const v = obj[k];
      if (v !== null && v !== undefined && String(v).trim() !== '') return v;
    }
  }
  return '';
}
function maskNIK_(nik){
  const s = String(nik).replace(/\s+/g,'').trim();
  if (s.length <= 4) return s;
  return '****-****-****-' + s.slice(-4);
}
function computeMasaKerja_(tmtVal){
  try{
    if(!tmtVal) return '-';
    const dt = new Date(tmtVal);
    if (isNaN(dt.getTime())) return '-';
    const now = new Date();
    let years = now.getFullYear() - dt.getFullYear();
    let months = now.getMonth() - dt.getMonth();
    if (months < 0){ years -= 1; months += 12; }
    if (years < 0) return '-';
    if (years === 0) return `${months} bulan`;
    return `${years} tahun ${months} bulan`;
  }catch(e){
    return '-';
  }
}

function getSensitiveFieldsList_() {

function getFieldType_(fieldKey) {
  const numberFields = ['NIK', 'No_KK', 'BPJS_Kes', 'BPJS_TK', 'Kode_Pos', 'No_HP', 'No._Rekening'];
  const dateFields = ['TMT', 'Tanggal_Lahir'];
  const selectFields = ['Jenis_Kelamin', 'Status_Nikah', 'Status_PTKP', 'Status_Kepeg', 'JABATAN'];
  const textareaFields = ['Alamat'];
  
  if (numberFields.includes(fieldKey)) return 'number';
  if (dateFields.includes(fieldKey)) return 'date';
  if (selectFields.includes(fieldKey)) return 'select';
  if (textareaFields.includes(fieldKey)) return 'textarea';
  return 'text';
}

function startEditField(fieldKey, fieldLabel, currentValue, fieldType) {
  if (!fieldKey) return;
  
  window.editFieldState = {
    fieldKey: fieldKey,
    fieldLabel: fieldLabel,
    oldValue: currentValue || '',
    fieldType: fieldType || 'text',
    isSensitive: getSensitiveFieldsList_().includes(fieldKey)
  };
  
  const modal = document.getElementById('editFieldModal');
  if (!modal) return;
  
  document.getElementById('editFieldLabel').textContent = fieldLabel || fieldKey;
  const input = document.getElementById('editFieldInput');
  if (input) {
    input.type = fieldType === 'number' ? 'number' : (fieldType === 'date' ? 'date' : 'text');
    input.value = currentValue || '';
    setTimeout(() => input.focus(), 100);
  }
  
  modal.classList.remove('hidden');
}

function cancelEditField() {
  const modal = document.getElementById('editFieldModal');
  if (modal) modal.classList.add('hidden');
  window.editFieldState = {};
}

function confirmEditField() {
  const input = document.getElementById('editFieldInput');
  if (!input) return;
  
  const newValue = input.value.trim();
  if (!newValue) {
    alert('Nilai tidak boleh kosong');
    return;
  }
  
  if (newValue === String(window.editFieldState.oldValue || '').trim()) {
    alert('Nilai baru sama dengan nilai lama');
    return;
  }
  
  // Tutup edit modal
  document.getElementById('editFieldModal').classList.add('hidden');
  
  // Buka confirm modal
  showConfirmChangeModal(newValue);
}

function showConfirmChangeModal(newValue) {
  const editState = window.editFieldState;
  
  document.getElementById('confirmFieldLabel').textContent = editState.fieldLabel || editState.fieldKey;
  document.getElementById('confirmOldValue').textContent = editState.oldValue || '-';
  document.getElementById('confirmNewValue').textContent = newValue || '-';
  
  const consentBox = document.getElementById('consentBox');
  const consentCheckbox = document.getElementById('consentCheckbox');
  
  if (editState.isSensitive) {
    consentBox.classList.remove('hidden');
    consentCheckbox.checked = false;
  } else {
    consentBox.classList.add('hidden');
    consentCheckbox.checked = false;
  }
  
  // Simpan new value di editFieldState
  window.editFieldState.newValue = newValue;
  
  // Update button state
  updateConfirmButtonState();
  
  const modal = document.getElementById('confirmChangeModal');
  if (modal) modal.classList.remove('hidden');
}

function updateConfirmButtonState() {
  const editState = window.editFieldState;
  const btn = document.getElementById('confirmSaveBtn');
  const consentCheckbox = document.getElementById('consentCheckbox');
  
  if (!btn) return;
  
  if (editState.isSensitive) {
    btn.disabled = !consentCheckbox.checked;
  } else {
    btn.disabled = false;
  }
}

  const modal = document.getElementById('confirmChangeModal');
  if (modal) modal.classList.add('hidden');
}

function saveFieldChange() {
  const state = window.editFieldState;
  
  if (!state.fieldKey || state.newValue === undefined) {
    alert('Data tidak lengkap');
    return;
  }
  
  const consentCheckbox = document.getElementById('consentCheckbox');
  const consentChecked = state.isSensitive ? consentCheckbox.checked : false;
  
  // Disable button during save
  const btn = document.getElementById('confirmSaveBtn');
  if (btn) btn.disabled = true;
  
  google.script.run.withSuccessHandler(res => {
    if (btn) btn.disabled = false;
    
    if (!res || !res.ok) {
      alert('Gagal menyimpan: ' + (res?.msg || 'Error tidak diketahui'));
      return;
    }
    
    // Success
    alert('Perubahan berhasil disimpan dan dicatat dalam histori');
    cancelConfirmChange();
    
    // Refresh profil
    renderProfil();
  }).withFailureHandler(err => {
    if (btn) btn.disabled = false;
    alert('Error: ' + (err?.message || String(err)));
  }).saveProfilFieldChange({
    field_key: state.fieldKey,
    field_label: state.fieldLabel,
    old_value: state.oldValue,
    new_value: state.newValue,
    consent_checked: consentChecked
  });
}

/* ===================== CLOSE MODALS ON OVERLAY CLICK ===================== */
document.addEventListener('click', function(event) {
  const editModal = document.getElementById('editFieldModal');
  const confirmModal = document.getElementById('confirmChangeModal');
  
  if (event.target === editModal) {
    editModal?.classList.add('hidden');
  }
  if (event.target === confirmModal) {
    confirmModal?.classList.add('hidden');
  }
});

boot();
</script>
