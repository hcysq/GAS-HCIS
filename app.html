<script>
const root = document.getElementById('root');
const nav = document.getElementById('nav');
const btnLogout = document.getElementById('btnLogout');

let state = {
  me: null,
  route: 'login',
};

const SESSION_TOKEN_KEY = 'HCIS_SESSION_TOKEN';
const SESSION_TOKEN_COOKIE = 'hcis_session';

function setSessionToken_(token){
  if (!token) return;
  localStorage.setItem(SESSION_TOKEN_KEY, token);
  document.cookie = `${SESSION_TOKEN_COOKIE}=${encodeURIComponent(token)}; path=/; SameSite=Lax`;
}

function clearSessionToken_(){
  localStorage.removeItem(SESSION_TOKEN_KEY);
  document.cookie = `${SESSION_TOKEN_COOKIE}=; path=/; Max-Age=0; SameSite=Lax`;
}

function getCookieValue_(name){
  const parts = document.cookie.split(';').map(p => p.trim());
  for (const part of parts) {
    if (part.startsWith(`${name}=`)) {
      return decodeURIComponent(part.substring(name.length + 1));
    }
  }
  return '';
}

function getSessionToken_(){
  return localStorage.getItem(SESSION_TOKEN_KEY) || getCookieValue_(SESSION_TOKEN_COOKIE) || '';
}

function withToken_(handler){
  const token = getSessionToken_();
  return handler({ token });
}

function isAuthed(){ return !!(state.me && state.me.ok); }

function goto(route){
  if (!isAuthed()){
    state.route='login';
    renderLogin();
    return;
  }
  state.route = route || 'dash';
  renderAppShell();
  setActiveTab(state.route);
  renderRoute(state.route);
}

function boot(){
  withToken_(request => {
    google.script.run.withSuccessHandler(res=>{
      if(!res || !res.ok){
        clearSessionToken_();
        state.me=null;
        state.route='login';
        renderLogin();
        return;
      }
      state.me=res;
      goto('dash');
    }).authMe(request);
  });
}

/* ===================== LOGIN ===================== */
function renderLogin(msg=''){
  nav.classList.add('hidden');
  btnLogout.classList.add('hidden');

  root.innerHTML=`
    <div class="card">
      <div style="font-size:18px;font-weight:900;margin-bottom:6px;">Masuk HCIS</div>
      <div class="muted" style="margin-bottom:12px;">Login menggunakan <b>NIP</b> dan <b>Password</b>.</div>

      ${msg ? `<div class="muted" style="color:#ffb4b4;margin-bottom:10px;">${escapeHtml(msg)}</div>` : ''}

      <div style="margin-bottom:10px;">
        <input id="nip" placeholder="NIP" autocomplete="username">
      </div>

      <div style="margin-bottom:12px;">
        <div class="input-wrap">
          <input id="pin" type="password" placeholder="Password" autocomplete="current-password">
          <button type="button" class="peek-btn" onclick="togglePassword('pin', this)" aria-label="Tampilkan password">
            👁️
          </button>
        </div>
      </div>

      <button class="btn primary" onclick="login()">Masuk</button>
      <div class="muted" style="margin-top:12px;">Jika lupa password, hubungi Admin HC.</div>
    </div>
  `;

  setTimeout(()=>{
    const pin = document.getElementById('pin');
    if(pin){
      pin.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter') login();
      });
    }
  }, 0);
}

function renderAppShell(){
  nav.classList.remove('hidden');
  btnLogout.classList.remove('hidden');
}

/* ===================== ROUTES ===================== */
function renderRoute(route){
  if(!isAuthed()) return renderLogin();

  if(route==='dash') return renderDashboard();
  if(route==='profil') return renderProfil();
  if(route==='admin') return renderPlaceholder_('Admin Panel');
  if(route==='team') return renderPlaceholder_('Kelola Tim');
  if(route==='settings'){
    if (typeof settingsResetState_ === 'function') settingsResetState_();
    return renderSettings();
  }

  if(route==='projects') return renderPlaceholder_('Progres Proyek');
  if(route==='absensi') return renderPlaceholder_('Absensi');
  if(route==='welfare') return renderPlaceholder_('Kesejahteraan');
  if(route==='development') return renderPlaceholder_('Pengembangan');

  return renderDashboard();
}

/* ===================== DASHBOARD ===================== */
function renderDashboard(){
  const me = state.me;
  
  // Helper function to check if user has a specific role (supports multiple roles)
  const hasRole = (role) => {
    if (!me) return false;
    // Support both single role string and array of roles
    if (Array.isArray(me.roles)) {
      return me.roles.includes(role);
    }
    return me.role === role;
  };
  
  // Display all roles (if array exists, join them; otherwise use single role)
  const roleDisplay = Array.isArray(me.roles) 
    ? me.roles.join(', ')
    : (me.role || 'PTK');

  const isAdmin = hasRole('ADMIN');
  const isKapla = hasRole('KAPLA');
  const isManager = isAdmin || isKapla;

  root.innerHTML=`
    <div class="card">
      <div style="font-weight:900;font-size:18px;">Assalamu'alaikum, ${escapeHtml(me.nama||me.nip)}</div>
      <div class="muted" style="margin-top:4px;">
        NIP: <b>${escapeHtml(me.nip)}</b> • Role: <b>${escapeHtml(roleDisplay)}</b>
      </div>
      <div class="muted" style="margin-top:6px;">
        <span id="dashUnit">Unit: …</span> • <span id="dashJabatan">Jabatan: …</span>
      </div>
    </div>

    <div class="card">
      <div style="font-weight:900;margin-bottom:10px;">Fitur HCIS</div>

      <div class="tileGrid">
        <div class="tile" onclick="goto('projects')">
          <div class="tileIcon">📌</div>
          <div>
            <div class="tileTitle">Progres Proyek</div>
            <div class="tileDesc">Program, milestone, task, laporan pekanan.</div>
          </div>
        </div>

        <div class="tile" onclick="goto('absensi')">
          <div class="tileIcon">🗓️</div>
          <div>
            <div class="tileTitle">Absensi</div>
            <div class="tileDesc">Jadwal pekanan, hadir, lembur, cuti & izin.</div>
          </div>
        </div>

        <div class="tile" onclick="goto('welfare')">
          <div class="tileIcon">💳</div>
          <div>
            <div class="tileTitle">Kesejahteraan</div>
            <div class="tileDesc">Slip gaji, klaim, reimbursement, pinjaman.</div>
          </div>
        </div>

        <div class="tile" onclick="goto('development')">
          <div class="tileIcon">🎓</div>
          <div>
            <div class="tileTitle">Pengembangan</div>
            <div class="tileDesc">Onboarding, kinerja, LMS, psikotes.</div>
          </div>
        </div>
      </div>

      <div class="muted" style="margin-top:12px;">
        Catatan: detail tiap fitur akan kita isi bertahap setelah CORE stabil.
      </div>
    </div>

    ${isAdmin ? `
    <div class="card">
      <div style="font-weight:900;margin-bottom:10px;display:flex;gap:8px;align-items:center;">
        <span>⚙️</span> <span>Kelola Admin</span>
      </div>
      <div style="padding:12px;text-align:center;background:rgba(255,255,255,0.05);border-radius:8px;border:1px solid rgba(255,255,255,0.1);">
        <div class="muted" style="margin-bottom:10px;">Kelola user, role, dan sistem</div>
        <button class="btn primary" onclick="goto('admin')">Buka Panel Admin</button>
      </div>
    </div>
    ` : ''}

    ${isKapla ? `
    <div class="card">
      <div style="font-weight:900;margin-bottom:10px;display:flex;gap:8px;align-items:center;">
        <span>👥</span> <span>Kelola Tim</span>
      </div>
      <div style="padding:12px;text-align:center;background:rgba(255,255,255,0.05);border-radius:8px;border:1px solid rgba(255,255,255,0.1);">
        <div class="muted" style="margin-bottom:10px;">Manage subordinates dan approvals</div>
        <button class="btn primary" onclick="goto('team')">Buka Kelola Tim</button>
      </div>
    </div>
    ` : ''}
  `;

  withToken_(request => {
    google.script.run.withSuccessHandler(res=>{
      if(!res || !res.ok || !res.data || !res.data.profile) return;
      const d = res.data.profile;
      const unit = d.Unit || '-';
      const jabatan = d.Jabatan || '-';
      const elUnit = document.getElementById('dashUnit');
      const elJab = document.getElementById('dashJabatan');
      if (elUnit) elUnit.innerHTML = `Unit: <b>${escapeHtml(unit)}</b>`;
      if (elJab)  elJab.innerHTML  = `Jabatan: <b>${escapeHtml(jabatan)}</b>`;
    }).getProfilUsersDetail(request);
  });
}

/* ===================== PROFIL ===================== */
function renderProfil(){
  root.innerHTML = '<div class="card"><div class="muted">Memuat profil...</div></div>';

  withToken_(request => {
    google.script.run
      .withSuccessHandler(res => {
        if(!res || !res.ok || !res.data) {
          root.innerHTML = `
            <div class="card">
              <div style="color:#ff6b6b;font-weight:800;">Profil tidak dapat dimuat</div>
              <div class="muted" style="margin-top:6px;">Silakan hubungi admin jika ada masalah.</div>
            </div>
          `;
          return;
        }

        const profile = res.data.profile || {};
        const pendidikan = Array.isArray(res.data.pendidikan) ? res.data.pendidikan : [];
        const getVal = (keys) => {
          for (const k of (Array.isArray(keys) ? keys : [keys])) {
            if (profile && profile[k] && String(profile[k]).trim()) return profile[k];
          }
          return '-';
        };

        const render = (label, value) => `
          <div class="profile-field">
            <div class="profile-label">${label}</div>
            <div class="profile-value">${escapeHtml(value || '-')}</div>
          </div>
        `;

        const renderPendidikan = () => {
          if (!pendidikan.length) {
            return `<div class="profile-empty">Belum ada data pendidikan.</div>`;
          }

          return `
            <div class="profile-edu">
              ${pendidikan.map((row) => `
                <div class="profile-edu-card">
                  <div class="profile-edu-title">${escapeHtml(row.Jenjang || '-')}${row.Kategori_Pendidikan ? ` • ${escapeHtml(row.Kategori_Pendidikan)}` : ''}</div>
                  <div class="profile-edu-body">
                    ${render('Institusi', row.Nama_Institusi)}
                    ${render('Jurusan/Peminatan', row.Jurusan_Peminatan)}
                    ${render('Tahun Masuk', row.Tahun_Masuk)}
                    ${render('Tahun Lulus', row.Tahun_Lulus)}
                    ${render('No Ijazah', row.No_Ijazah)}
                    ${render('NISN/NIM', row.NISN_NIM)}
                    ${render('Kota', row.Kota)}
                    ${render('Link Ijazah', row.Link_Ijazah)}
                    ${render('Link Transkrip/SKHUN', row.Link_Transkrip_SKHUN)}
                    ${render('Keterangan', row.Keterangan)}
                  </div>
                </div>
              `).join('')}
            </div>
          `;
        };

        root.innerHTML = `
          <div class="card profile-card">
            <div class="profile-title">Profil Saya</div>
            
            <div style="display:grid;gap:24px;">
              <!-- Ringkasan Kepegawaian -->
              <div>
                <div class="profile-section-title">RINGKASAN KEPEGAWAIAN</div>
                <div class="profile-section">
                  ${render('Nama', getVal('Nama'))}
                  ${render('NIP', getVal('NIP'))}
                  ${render('Email', getVal('Email'))}
                  ${render('Unit', getVal('Unit'))}
                  ${render('Jabatan', getVal('Jabatan'))}
                  ${render('Status Kepegawaian', getVal('Status_Kepegawaian'))}
                  ${render('TMT Pegawai', getVal('TMT_Pegawai'))}
                  ${render('Masa Kerja', getVal('Masa_Kerja'))}
                  ${render('Role', getVal('Role'))}
                  ${render('Status Aktif', getVal('Aktif'))}
              </div>
            </div>

            <!-- Data Pribadi -->
            <div>
              <div class="profile-section-title">DATA PRIBADI</div>
              <div class="profile-section">
                ${render('Tempat Lahir', getVal('Tempat_Lahir'))}
                ${render('Tanggal Lahir', getVal('Tanggal_Lahir'))}
                ${render('Jenis Kelamin', getVal('Jenis_Kelamin'))}
                ${render('Status Pernikahan', getVal('Status_Pernikahan'))}
                ${render('Pendidikan Terakhir', getVal('Pendidikan_Terakhir'))}
                ${render('Gelar Akademik Depan', getVal('Gelar_Akademik_Depan'))}
                ${render('Gelar Akademik Belakang', getVal('Gelar_Akademik_Belakang'))}
                ${render('Ayah Kandung', getVal('Ayah_Kandung'))}
                ${render('Ibu Kandung', getVal('Ibu_Kandung'))}
                ${render('No. KK', getVal('No_KK'))}
              </div>
            </div>

            <!-- Kontak -->
            <div>
              <div class="profile-section-title">KONTAK</div>
              <div class="profile-section">
                ${render('Nomor HP/WA', getVal('No_HP'))}
                ${render('Alamat', getVal('Alamat'))}
                ${render('Kelurahan/Desa', getVal('Kelurahan_Desa'))}
                ${render('Kecamatan', getVal('Kecamatan'))}
                ${render('Kabupaten/Kota', getVal('Kabupaten_Kota'))}
                ${render('Kode Pos', getVal('Kode_Pos'))}
              </div>
            </div>

            <!-- Kontak Darurat -->
            <div>
              <div class="profile-section-title">KONTAK DARURAT</div>
              <div class="profile-section">
                ${render('Nama', getVal('Kontak_Darurat_Nama'))}
                ${render('Hubungan', getVal('Kontak_Darurat_Hubungan'))}
                ${render('Nomor HP/WA', getVal('Kontak_Darurat_HP_WA'))}
              </div>
            </div>

            <!-- Administrasi -->
            <div>
              <div class="profile-section-title">ADMINISTRASI</div>
              <div class="profile-section">
                ${render('BPJS Kesehatan', getVal('BPJS_Kesehatan'))}
                ${render('BPJS Ketenagakerjaan', getVal('BPJS_Ketenagakerjaan'))}
                ${render('Status PTKP', getVal('Status_PTKP'))}
                ${render('No. Rekening Bank', getVal('No._Rekening'))}
              </div>
            </div>

            <!-- Pendidikan -->
            <div>
              <div class="profile-section-title">RIWAYAT PENDIDIKAN</div>
              ${renderPendidikan()}
            </div>
          </div>
        </div>
        `;
      })
      .getProfilUsersDetail(request);
  });
}

/* ===================== PLACEHOLDER ===================== */
function renderPlaceholder_(title){
  root.innerHTML = `
    <div class="card">
      <div style="font-weight:900;font-size:18px;">${escapeHtml(title)}</div>
      <div class="muted" style="margin-top:6px;">
        Modul ini akan kita isi setelah CORE beres (data + approval + UI detail).
      </div>
      <div style="margin-top:12px;">
        <button class="btn primary" onclick="goto('dash')">Kembali ke Dashboard</button>
      </div>
    </div>
  `;
}

/* ===================== NAV ===================== */
function setActiveTab(route){
  const tabs = nav.querySelectorAll('.tab');
  tabs.forEach(t=>t.classList.remove('active'));
  if(route==='dash') tabs[0]?.classList.add('active');
  else if(route==='profil') tabs[1]?.classList.add('active');
  else if(route==='settings') tabs[2]?.classList.add('active');
  else tabs[0]?.classList.add('active');
}
function go(route){ goto(route); }

/* ===================== AUTH ===================== */
function login(){
  const nip = document.getElementById('nip')?.value || '';
  const pin = document.getElementById('pin')?.value || '';

  google.script.run.withSuccessHandler(res=>{
    if(!res || !res.ok) return renderLogin(res?.msg || 'Login gagal');
    setSessionToken_(res.token);
    boot();
  }).authLogin(nip, pin);
}
function logout(){
  withToken_(request => {
    google.script.run.withSuccessHandler(()=>{
      clearSessionToken_();
      if (typeof settingsResetState_ === 'function') settingsResetState_();
      state.me=null;
      state.route='login';
      renderLogin('Anda sudah keluar.');
    }).authLogout(request);
  });
}

/* ===================== PEEK PASSWORD ===================== */
function togglePassword(inputId, btn){
  const input = document.getElementById(inputId);
  if(!input) return;
  const isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
  btn.textContent = isHidden ? '🙈' : '👁️';
}

/* ===================== UTILS ===================== */
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"'`=\/]/g, s => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',
    "'":'&#39;','`':'&#x60;','=':'&#x3D;','/':'&#x2F;'
  }[s]));
}

boot();
</script>
