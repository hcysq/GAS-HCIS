<script>
// ========= DEBUG: A/B TEST HEADER ENHANCEMENTS =========
// Set ke TRUE untuk disable header/logo/sticky (test apakah berasal dari sini)
// Set ke FALSE untuk pakai header enhancements normal
const DEBUG_DISABLE_HEADER_ENHANCEMENTS = false;

console.log("[HCIS] DEBUG: header enhancements enabled?", !DEBUG_DISABLE_HEADER_ENHANCEMENTS);

const root = document.getElementById('root');
const nav = document.getElementById('nav');
const btnLogout = document.getElementById('btnLogout');

// Guard: jika elemen tidak ditemukan, initialize dengan empty
if (!root) console.error('[HCIS] root element not found');
if (!nav) console.error('[HCIS] nav element not found');
if (!btnLogout) console.error('[HCIS] btnLogout element not found');

let state = {
  me: null,
  route: 'login',
};

function getDeviceId_(){
  return sessionStorage.getItem('deviceId') || '';
}

function setDeviceId_(deviceId){
  if (deviceId) {
    sessionStorage.setItem('deviceId', deviceId);
  }
}

function getAuthPayload_(){
  return { deviceId: getDeviceId_() };
}

function isAuthed(){ return !!(state.me && state.me.ok); }

function goto(route){
  if (!isAuthed()){
    state.route='login';
    renderLogin();
    return;
  }
  state.route = route || 'dash';
  console.log('[HCIS] goto:', state.route);
  
  if (!root) {
    console.error('[HCIS] goto: root element not found');
    return;
  }
  if (!nav) {
    console.warn('[HCIS] goto: nav element not found (okay if on login)');
  }
  
  renderAppShell();
  setActiveTab(state.route);
  renderRoute(state.route);
  console.log('[HCIS] goto completed:', state.route);
}

function boot(){
  console.log('[HCIS] boot started');
  console.log('[HCIS] DEBUG_DISABLE_HEADER_ENHANCEMENTS:', DEBUG_DISABLE_HEADER_ENHANCEMENTS);
  
  if (!root) {
    console.error('[HCIS] boot: root element missing from DOM');
    return;
  }
  
  // Apply header static class jika debug mode enabled
  if (DEBUG_DISABLE_HEADER_ENHANCEMENTS) {
    const headerElem = document.getElementById('headerTopbar');
    if (headerElem) {
      headerElem.classList.add('header-static');
      console.log('[HCIS] header static class applied');
    }
  }
  
  google.script.run.withSuccessHandler(res=>{
    console.log('[HCIS] authMe response:', res?.ok ? 'OK' : 'FAIL');
    if(!res || !res.ok){
      state.me=null;
      state.route='login';
      console.log('[HCIS] render login');
      renderLogin();
      return;
    }
    setDeviceId_(res?.deviceId);
    state.me=res;
    goto('dash');
  }).authMe(getAuthPayload_());
}

/* ===================== LOGIN ===================== */
function renderLogin(msg=''){
  if (nav) nav.classList.add('hidden');
  if (btnLogout) btnLogout.classList.add('hidden');

  if (!root) {
    console.error('[HCIS] Cannot render login: root element not found');
    return;
  }

  let msgHtml = '';
  if (msg) {
    msgHtml = '<div class="muted" style="color:#ffb4b4;margin-bottom:10px;">' + escapeHtml(msg) + '</div>';
  }

  root.innerHTML=`
    <div class="card">
      <div style="font-size:18px;font-weight:900;margin-bottom:6px;">Masuk HCIS</div>
      <div class="muted" style="margin-bottom:12px;">Login menggunakan <b>NIP</b> dan <b>Password</b>.</div>

      ${msgHtml}

      <form onsubmit="event.preventDefault(); login();" id="loginForm">
        <div style="margin-bottom:10px;">
          <input id="nip" placeholder="NIP" autocomplete="username" type="text" required>
        </div>

        <div style="margin-bottom:12px;">
          <div class="input-wrap">
            <input id="pin" type="password" placeholder="Password" autocomplete="current-password" required>
            <button type="button" class="peek-btn" onclick="togglePassword('pin', this)" aria-label="Tampilkan password">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="btn primary">Masuk</button>
      </form>

      <div class="muted" style="margin-top:12px;">
        <a href="javascript:void(0)" onclick="redirectToWhatsApp()" style="color:rgba(14,165,233,.92); text-decoration:none; font-weight:600;">Lupa Password?</a>
      </div>
    </div>
  `;
}

function redirectToWhatsApp(){
  const phone = '+628517520627';
  const message = encodeURIComponent("Assalamu'alaikum Admin HCM, saya lupa password HCIS. Mohon bantuan reset akun saya.");
  const waUrl = `https://wa.me/${phone}?text=${message}`;
  window.open(waUrl, '_blank');
}

function renderAppShell(){
  if (nav) nav.classList.remove('hidden');
  if (btnLogout) btnLogout.classList.remove('hidden');
}

/* ===================== ROUTES ===================== */
function renderRoute(route){
  if(!isAuthed()) return renderLogin();

  if(route==='dash') return renderDashboard();
  if(route==='profil') return renderProfil();
  if(route==='settings'){
    if (typeof settingsResetState_ === 'function') settingsResetState_();
    return renderSettings(); // <- dari settings.html
  }

  // placeholders modul
  if(route==='projects') return renderProjects_();
  if(route==='absensi') return renderAbsensi_();
  if(route==='welfare') return renderWelfare();
  if(route==='development') return renderDevelopment_();
  if(route==='performa') return renderPerforma_();
  if(route==='manajemen-unit') return renderManajemenUnit_();
  if(route==='dokumen') return renderDokumenAdministrasi_();
  if(route==='layanan') return showServiceMenu_();
  if(route==='tutorial-slip-gaji') return renderTutorialSlipGaji_();
  if(route==='tutorial-password') return renderTutorialGantiPassword_();
  if(route==='tutorial-profil') return renderTutorialEditProfil_();

  return renderDashboard();
}

/* ===================== PROFIL BARU ===================== */
function renderProfil(){
  root.innerHTML = '<div class="card"><div class="muted">Memuat profil lengkap...</div></div>';

  google.script.run
    .withSuccessHandler(res => {
      if(!res || !res.ok || !res.data) {
        const msg = escapeHtml(res?.msg || 'Profil tidak dapat dimuat.');
        root.innerHTML = `
          <div class="card">
            <div style="color:#c0392b;font-weight:800;">Gagal memuat profil</div>
            <div class="muted" style="margin-top:6px;">${msg}</div>
            <div class="muted" style="margin-top:6px;">Data belum tersedia dari hasil pencarian USER_ID dan NIP sesi Anda.</div>
          </div>
        `;
        return;
      }

      const payload = buildProfilPayload_(res.data);
      renderProfilLayout_(payload);
    })
    .getProfilUsersDetail(getAuthPayload_());
}

function buildProfilPayload_(raw){
  // Raw data dari buildStructuredProfile_() sudah dalam format yang benar
  // Cukup return langsung tanpa re-mapping
  return raw;
}

function normalizeEduFormal_(val){
  const arr = parseEduArray_(val);
  return arr.map(x => ({
    level: x.level || x.jenjang || x.tingkat || '-',
    nama: x.nama || x.sekolah || x.institusi || '-',
    jur: x.jur || x.jurusan || '',
    thn: x.thn || x.tahun || x.year || '',
    link: x.link || x.url || x.ijazah || ''
  }));
}

function normalizeEduNonFormal_(val){
  const arr = parseEduArray_(val);
  return arr.map(x => ({
    nama: x.nama || x.pelatihan || x.program || '-',
    thn: x.thn || x.tahun || x.year || '',
    link: x.link || x.url || x.sertifikat || ''
  }));
}

function parseEduArray_(val){
  if (Array.isArray(val)) return val.filter(Boolean);
  if (typeof val === 'string' && val.trim()){
    try{
      const parsed = JSON.parse(val);
      if (Array.isArray(parsed)) return parsed.filter(Boolean);
    }catch(e){ /* ignore */ }
  }
  return [];
}

function formatDateReadable_(val){
  try{
    if(!val) return '';
    const dt = new Date(val);
    if (isNaN(dt)) return String(val || '');
    return dt.toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' });
  }catch(e){
    return String(val || '');
  }
}

function loadAvailableSlipGajiBulan_(){
  google.script.run
    .withSuccessHandler(res => {
      if(!res || !res.ok){
        document.getElementById('slipResultContainer').innerHTML = `<div class="card"><div style="color:#c0392b;">Error: ${escapeHtml(res?.msg || 'Gagal memuat data')}</div></div>`;
        document.getElementById('slipResultContainer').style.display = 'block';
        return;
      }

      const { tahunList, bulanPerTahun } = res.data;
      
      // Populate tahun
      const selTahun = document.getElementById('slipTahun');
      selTahun.innerHTML = '<option value="">-- Pilih Tahun --</option>';
      tahunList.forEach(tahun => {
        const opt = document.createElement('option');
        opt.value = tahun;
        opt.textContent = tahun;
        selTahun.appendChild(opt);
      });
      
      // Default ke tahun terbaru
      if(tahunList.length > 0){
        selTahun.value = tahunList[tahunList.length - 1];
        onTahunChange();
      }
      
      // Store untuk reference
      window.slipGajiData = { tahunList, bulanPerTahun };
    })
    .getAvailableSlipGajiBulan(getAuthPayload_());
}

function onTahunChange(){
  const tahun = document.getElementById('slipTahun').value;
  const selBulan = document.getElementById('slipBulan');
  
  if(!tahun || !window.slipGajiData){
    selBulan.innerHTML = '<option value="">-- Pilih Tahun Terlebih Dahulu --</option>';
    return;
  }

  const bulanList = window.slipGajiData.bulanPerTahun[tahun] || [];
  selBulan.innerHTML = '<option value="">-- Pilih Bulan --</option>';
  
  // Filter out empty/"-" values
  const validBulan = bulanList.filter(nama => nama && nama.trim() && nama !== '-');
  
  validBulan.forEach(nama => {
    const opt = document.createElement('option');
    opt.value = nama;
    opt.textContent = nama;
    selBulan.appendChild(opt);
  });
  
  updateTampilkanButton();
}

function updateTampilkanButton(){
  const tahun = document.getElementById('slipTahun').value;
  const bulan = document.getElementById('slipBulan').value;
  const btn = document.getElementById('btnTampilSlip');
  
  btn.disabled = !tahun || !bulan;
}

function tampilkanSlipGaji(){
  const tahun = document.getElementById('slipTahun')?.value;
  const bulan = document.getElementById('slipBulan')?.value;

  if(!tahun || !bulan){
    alert('Pilih Tahun dan Bulan terlebih dahulu');
    return;
  }

  const resultContainer = document.getElementById('slipResultContainer');
  resultContainer.innerHTML = '<div class="card"><div class="muted">Memuat slip gaji...</div></div>';
  resultContainer.style.display = 'block';

  google.script.run
    .withSuccessHandler(res => {
      if(!res || !res.ok){
        resultContainer.innerHTML = `<div class="card"><div style="color:#c0392b;font-weight:800;">Slip Gaji Tidak Ditemukan</div><div class="muted" style="margin-top:6px;">${escapeHtml(res?.msg || 'Slip gaji periode ini belum tersedia.')}</div></div>`;
        return;
      }
      renderSlipGajiResult_(res.data);
    })
    .withFailureHandler(err => {
      resultContainer.innerHTML = `<div class="card"><div style="color:#c0392b;font-weight:800;">Error</div><div class="muted" style="margin-top:6px;">${escapeHtml(err?.message || String(err))}</div></div>`;
    })
    .getSlipGaji({ tahun: Number(tahun), bulan, deviceId: getDeviceId_() });
}

function renderSlipGajiResult_(data){
  const resultContainer = document.getElementById('slipResultContainer');
  
  // Format currency
  const formatCurrency = (num) => {
    if(!num || num === 0) return '-';
    return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(num);
  };

  // Format percentage
  const formatPercentage = (val) => {
    if(!val) return '-';
    const str = String(val).trim();
    // If already contains %, return as-is
    if(str.includes('%')) return str;
    // Parse as number
    const num = parseFloat(str.replace(',', '.'));
    if(isNaN(num)) return str;
    // If <= 1, multiply by 100
    if(num <= 1) return (num * 100).toLocaleString('id-ID', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '%';
    // If > 1 and <= 100, format as-is
    if(num <= 100) return num.toLocaleString('id-ID', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '%';
    return str; // Return original if out of range
  };

  const safeVal = (val) => val && val !== '-' ? val : '-';

  // Card Identitas
  const identitasHtml = `

function toggleAccordion(id){
  const el = document.getElementById(id);
  const icon = document.getElementById(id + 'Icon');
  if(!el) return;
  
  const isHidden = el.style.display === 'none';
  el.style.display = isHidden ? 'block' : 'none';
  if(icon) icon.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
}

function kirimSlipGajiPDF(){
  const tahun = document.getElementById('slipTahun')?.value;
  const bulan = document.getElementById('slipBulan')?.value;

  if(!tahun || !bulan){
    alert('Pilih Tahun dan Bulan terlebih dahulu');
    return;
  }

  const msgEl = document.getElementById('pdfResultMsg');
  msgEl.innerHTML = '⏳ Membuat dan mengirim slip...';
  msgEl.style.display = 'block';
  msgEl.style.background = 'rgba(33, 150, 243, 0.15)';
  msgEl.style.color = 'rgba(33, 150, 243, 0.95)';

  google.script.run
    .withSuccessHandler(res => {
      if(!res || !res.ok){
        // Check if already exists
        if(res?.alreadyExists){
          msgEl.innerHTML = `⚠️ ${escapeHtml(res.msg)}`;
          msgEl.style.background = 'rgba(255, 152, 0, 0.15)';
          msgEl.style.color = 'rgba(255, 152, 0, 0.95)';
        } else {
          msgEl.innerHTML = `❌ ${escapeHtml(res?.msg || 'Gagal membuat slip')}`;
          msgEl.style.background = 'rgba(244, 67, 54, 0.15)';
          msgEl.style.color = 'rgba(244, 67, 54, 0.95)';
        }
        return;
      }
      
      msgEl.innerHTML = `✅ ${escapeHtml(res.msg)}`;
      msgEl.style.background = 'rgba(76, 175, 80, 0.15)';
      msgEl.style.color = 'rgba(76, 175, 80, 0.95)';
    })
    .withFailureHandler(err => {
      msgEl.innerHTML = `❌ ${escapeHtml(err?.message || 'Gagal membuat slip')}`;
      msgEl.style.background = 'rgba(244, 67, 54, 0.15)';
      msgEl.style.color = 'rgba(244, 67, 54, 0.95)';
    })
    .generateAndSaveSlipGajiPDF({ tahun: parseInt(tahun, 10), bulan, deviceId: getDeviceId_() });
}

function setActiveTab(route){
  if (!nav) {
    console.warn('[HCIS] setActiveTab: nav element not found');
    return;
  }
  
  const tabs = nav.querySelectorAll('.tab');
  if (!tabs || tabs.length === 0) {
    console.warn('[HCIS] setActiveTab: no tabs found');
    return;
  }
  
  tabs.forEach(t=>t.classList.remove('active'));
  if(route==='dash') tabs[0]?.classList.add('active');
  else if(route==='profil') tabs[1]?.classList.add('active');
  else if(route==='settings') tabs[2]?.classList.add('active');
  else tabs[0]?.classList.add('active');
  
  console.log('[HCIS] setActiveTab:', route);
}

/* ===================== AUTH ===================== */
function login(){
  const nip = document.getElementById('nip')?.value || '';
  const pin = document.getElementById('pin')?.value || '';

  google.script.run.withSuccessHandler(res=>{
    if(!res || !res.ok) {
      let errorMsg = res?.msg || 'Login gagal';
      
      // Handle session errors
      if (errorMsg.includes('ALREADY_LOGGED_IN')) {
        errorMsg = 'NIP ini sedang login di device lain. Session lama akan dihapus. Silakan login ulang.';
      } else if (errorMsg.includes('SESSION_EXPIRED')) {
        errorMsg = 'Sesi Anda telah kadaluarsa. Silakan login kembali.';
      }
      
      return renderLogin(errorMsg);
    }
    setDeviceId_(res?.deviceId);
    boot();
  }).authLogin(nip, pin);
}
function logout(){
  google.script.run.withSuccessHandler(()=>{
    if (typeof settingsResetState_ === 'function') settingsResetState_();
    state.me=null;
    state.route='login';
    renderLogin('Anda sudah keluar.');
  }).authLogout(getAuthPayload_());
}

/* ===================== UTILS ===================== */
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"'`=\/]/g, s => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',
    "'":'&#39;','`':'&#x60;','=':'&#x3D;','/':'&#x2F;'
  }[s]));
}
function kv(label, value){
  return `
    <div style="display:flex;gap:10px;align-items:flex-start;margin:8px 0;">
      <div style="flex:0 0 160px;max-width:160px;" class="muted">${escapeHtml(label)}</div>
      <div style="flex:1;font-weight:800;color:rgba(255,255,255,.92);">${escapeHtml(value ?? '-')}</div>
    </div>
  `;
}
function pick_(obj, keys){
  for (const k of keys){
    if (obj && Object.prototype.hasOwnProperty.call(obj, k)){
      const v = obj[k];
      if (v !== null && v !== undefined && String(v).trim() !== '') return v;
    }
  }
  return '';
}
function maskNIK_(nik){
  const s = String(nik).replace(/\s+/g,'').trim();
  if (s.length <= 4) return s;
  return '****-****-****-' + s.slice(-4);
}
function computeMasaKerja_(tmtVal){
  try{
    if(!tmtVal) return '-';
    const dt = new Date(tmtVal);
    if (isNaN(dt.getTime())) return '-';
    const now = new Date();
    let years = now.getFullYear() - dt.getFullYear();
    let months = now.getMonth() - dt.getMonth();
    if (months < 0){ years -= 1; months += 12; }
    if (years < 0) return '-';
    if (years === 0) return `${months} bulan`;
    return `${years} tahun ${months} bulan`;
  }catch(e){
    return '-';
  }
}

/* ===================== FIELD EDIT UTILITIES ===================== */

function getSensitiveFieldsList_() {
  return ['NIK', 'No._Rekening'];
}

function getFieldType_(fieldKey) {
  const numberFields = ['NIK', 'No_KK', 'BPJS_Kes', 'BPJS_TK', 'Kode_Pos', 'No_HP', 'No._Rekening'];
  const dateFields = ['TMT', 'Tanggal_Lahir'];
  const selectFields = ['Jenis_Kelamin', 'Status_Nikah', 'Status_PTKP', 'Status_Kepeg', 'JABATAN'];
  const textareaFields = ['Alamat'];
  
  if (numberFields.includes(fieldKey)) return 'number';
  if (dateFields.includes(fieldKey)) return 'date';
  if (selectFields.includes(fieldKey)) return 'select';
  if (textareaFields.includes(fieldKey)) return 'textarea';
  return 'text';
}

function startEditField(fieldKey, fieldLabel, currentValue, fieldType) {
  if (!fieldKey) return;
  
  window.editFieldState = {
    fieldKey: fieldKey,
    fieldLabel: fieldLabel,
    oldValue: currentValue || '',
    fieldType: fieldType || 'text',
    isSensitive: getSensitiveFieldsList_().includes(fieldKey)
  };
  
  const modal = document.getElementById('editFieldModal');
  if (!modal) return;
  
  document.getElementById('editFieldLabel').textContent = fieldLabel || fieldKey;
  const input = document.getElementById('editFieldInput');
  if (input) {
    input.type = fieldType === 'number' ? 'number' : (fieldType === 'date' ? 'date' : 'text');
    input.value = currentValue || '';
    setTimeout(() => input.focus(), 100);
  }
  
  modal.classList.remove('hidden');
}

function cancelEditField() {
  const modal = document.getElementById('editFieldModal');
  if (modal) modal.classList.add('hidden');
  window.editFieldState = {};
}

function confirmEditField() {
  const input = document.getElementById('editFieldInput');
  if (!input) return;
  
  const newValue = input.value.trim();
  if (!newValue) {
    alert('Nilai tidak boleh kosong');
    return;
  }
  
  if (newValue === String(window.editFieldState.oldValue || '').trim()) {
    alert('Nilai baru sama dengan nilai lama');
    return;
  }
  
  // Tutup edit modal
  document.getElementById('editFieldModal').classList.add('hidden');
  
  // Buka confirm modal
  showConfirmChangeModal(newValue);
}

function showConfirmChangeModal(newValue) {
  const editState = window.editFieldState;
  
  document.getElementById('confirmFieldLabel').textContent = editState.fieldLabel || editState.fieldKey;
  document.getElementById('confirmOldValue').textContent = editState.oldValue || '-';
  document.getElementById('confirmNewValue').textContent = newValue || '-';
  
  const consentBox = document.getElementById('consentBox');
  const consentCheckbox = document.getElementById('consentCheckbox');
  
  if (editState.isSensitive) {
    consentBox.classList.remove('hidden');
    consentCheckbox.checked = false;
  } else {
    consentBox.classList.add('hidden');
    consentCheckbox.checked = false;
  }
  
  // Simpan new value di editFieldState
  window.editFieldState.newValue = newValue;
  
  // Update button state
  updateConfirmButtonState();
  
  const modal = document.getElementById('confirmChangeModal');
  if (modal) modal.classList.remove('hidden');
}

function updateConfirmButtonState() {
  const editState = window.editFieldState;
  const btn = document.getElementById('confirmSaveBtn');
  const consentCheckbox = document.getElementById('consentCheckbox');
  
  if (!btn) return;
  
  if (editState.isSensitive) {
    btn.disabled = !consentCheckbox.checked;
  } else {
    btn.disabled = false;
  }
}

function cancelConfirmChange() {
  const modal = document.getElementById('confirmChangeModal');
  if (modal) modal.classList.add('hidden');
}

function saveFieldChange() {
  const state = window.editFieldState;
  
  if (!state.fieldKey || state.newValue === undefined) {
    alert('Data tidak lengkap');
    return;
  }
  
  const consentCheckbox = document.getElementById('consentCheckbox');
  const consentChecked = state.isSensitive ? consentCheckbox.checked : false;
  
  // Disable button during save
  const btn = document.getElementById('confirmSaveBtn');
  if (btn) btn.disabled = true;
  
  google.script.run.withSuccessHandler(res => {
    if (btn) btn.disabled = false;
    
    if (!res || !res.ok) {
      alert('Gagal menyimpan: ' + (res?.msg || 'Error tidak diketahui'));
      return;
    }
    
    // Success
    alert('Perubahan berhasil disimpan dan dicatat dalam histori');
    cancelConfirmChange();
    
    // Refresh profil
    renderProfil();
  }).withFailureHandler(err => {
    if (btn) btn.disabled = false;
    alert('Error: ' + (err?.message || String(err)));
  }).saveProfilFieldChange({
    field_key: state.fieldKey,
    field_label: state.fieldLabel,
    old_value: state.oldValue,
    new_value: state.newValue,
    consent_checked: consentChecked,
    deviceId: getDeviceId_()
  });
}

/* ===================== CLOSE MODALS ON OVERLAY CLICK ===================== */
document.addEventListener('click', function(event) {
  const editModal = document.getElementById('editFieldModal');
  const confirmModal = document.getElementById('confirmChangeModal');
  
  if (event.target === editModal) {
    editModal?.classList.add('hidden');
  }
  if (event.target === confirmModal) {
    confirmModal?.classList.add('hidden');
  }
});

boot();
</script>
