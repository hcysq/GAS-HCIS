<script>
/**
 * Settings Wizard: Change Password with No_HP OTP
 * Depends on:
 * - escapeHtml() in app.html
 * - goto() in app.html
 * Backend:
 * - requestPasswordChange(oldPassword)
 * - verifyPasswordOTP(otp)
 * - updatePassword(newPass)
 */

const SETTINGS_STATE = {
  step: 1,               // 1=check old password + send OTP, 2=verify OTP, 3=set new password
  msg: '',
  msgType: 'info',       // info | error | success
  lastOtpSentAt: null,
  currentMenu: 'main',   // main | password | help | about
};

function settingsResetState_(){
  SETTINGS_STATE.step = 1;
  SETTINGS_STATE.msg = '';
  SETTINGS_STATE.msgType = 'info';
  SETTINGS_STATE.lastOtpSentAt = null;
  SETTINGS_STATE.currentMenu = 'main';
}

function renderSettings(){
  // Render based on currentMenu
  if (SETTINGS_STATE.currentMenu === 'main') {
    renderSettingsMain_();
  } else if (SETTINGS_STATE.currentMenu === 'password') {
    renderSettingsPasswordFlow_();
  } else if (SETTINGS_STATE.currentMenu === 'help') {
    renderSettingsHelp_();
  } else if (SETTINGS_STATE.currentMenu === 'about') {
    renderSettingsAbout_();
  } else if (SETTINGS_STATE.currentMenu === 'history' || SETTINGS_STATE.currentMenu === 'preferences') {
    renderSettingsComingSoon_(SETTINGS_STATE.currentMenu);
  }
}

  root.innerHTML = `

    <!-- Menu Grid -->
    <div class="card" style="padding:0; overflow:hidden; border-radius:16px;">

      <div style="display:flex; align-items:center; padding:14px; border-bottom:1px solid rgba(255,255,255,.10); cursor:pointer; transition:background .2s ease;" onclick="settingsGoToMenu_('password')" onmouseover="this.style.background='rgba(255,255,255,.08)'" onmouseout="this.style.background=''">
        <div style="flex:1;">
          <div style="font-weight:700; color:rgba(255,255,255,.96); font-size:14px;">Ganti Password</div>

          <div style="font-weight:700; color:rgba(255,255,255,.96); font-size:14px;">Riwayat Login</div>

        </div>
        <div style="background:rgba(255,165,0,.25); color:rgba(255,165,0,.96); padding:4px 8px; border-radius:6px; font-size:11px; font-weight:700;">Coming Soon</div>

          <div style="font-weight:700; color:rgba(255,255,255,.96); font-size:14px;">Preferensi Tampilan</div>

        </div>
        <div style="background:rgba(255,165,0,.25); color:rgba(255,165,0,.96); padding:4px 8px; border-radius:6px; font-size:11px; font-weight:700;">Coming Soon</div>
      </div>

      <!-- Bantuan & Dukungan -->
      <div style="display:flex; align-items:center; padding:14px; border-bottom:1px solid rgba(255,255,255,.10); cursor:pointer; transition:background .2s ease;" onclick="settingsGoToMenu_('help')" onmouseover="this.style.background='rgba(255,255,255,.08)'" onmouseout="this.style.background=''">
        <div style="flex:1;">
          <div style="font-weight:700; color:rgba(255,255,255,.96); font-size:14px;">Bantuan & Dukungan</div>
          <div style="font-size:12px; color:rgba(255,255,255,.68); margin-top:4px;">Hubungi tim dukungan</div>
        </div>
        <div style="color:rgba(255,255,255,.50); font-size:18px;">›</div>
      </div>

      <!-- Tentang Aplikasi -->
      <div style="display:flex; align-items:center; padding:14px; cursor:pointer; transition:background .2s ease;" onclick="settingsGoToMenu_('about')" onmouseover="this.style.background='rgba(255,255,255,.08)'" onmouseout="this.style.background=''">
        <div style="flex:1;">
          <div style="font-weight:700; color:rgba(255,255,255,.96); font-size:14px;">Tentang Aplikasi</div>
          <div style="font-size:12px; color:rgba(255,255,255,.68); margin-top:4px;">Informasi aplikasi dan versi</div>
        </div>
        <div style="color:rgba(255,255,255,.50); font-size:18px;">›</div>
      </div>
    </div>

    <!-- Keluar -->
    <div class="card">
      <button class="btn" style="background:rgba(255,100,100,.20);color:rgba(255,100,100,.95);border:1px solid rgba(255,100,100,.40); font-weight:700;" onclick="logout()">
        Keluar
      </button>
    </div>
  `;
}

function renderSettingsPasswordFlow_(){
  // Header dengan tombol kembali
  const headerHtml = `
    <div class="card" style="display:flex; align-items:center; gap:10px; padding:14px; margin-bottom:0; border-bottom:1px solid rgba(255,255,255,.12); cursor:pointer;" onclick="settingsGoToMenu_('main')">
      <div style="font-size:20px;">‹</div>
      <div style="font-weight:700; font-size:16px; color:rgba(255,255,255,.95);">Ganti Password</div>
    </div>
  `;

  root.innerHTML = headerHtml + renderChangePasswordCard_();
}

function renderSettingsHelp_(){
  const headerHtml = `
    <div class="card" style="display:flex; align-items:center; gap:10px; padding:14px; margin-bottom:0; border-bottom:1px solid rgba(255,255,255,.12); cursor:pointer;" onclick="settingsGoToMenu_('main')">
      <div style="font-size:20px;">‹</div>
      <div style="font-weight:700; font-size:16px; color:rgba(255,255,255,.95);">Bantuan & Dukungan</div>
    </div>
  `;

  const contentHtml = `
    <div class="card" style="margin-top:0; border-radius:0 0 16px 16px;">
      <div style="font-weight:700; font-size:14px; color:rgba(255,255,255,.95); margin-bottom:12px;">Hubungi Tim Dukungan</div>
      
      <div style="background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:14px; margin-bottom:14px;">
        <div style="color:rgba(255,255,255,.85); font-size:13px; line-height:1.6; margin-bottom:12px;">
          Untuk bantuan terkait akun dan penggunaan aplikasi, silakan hubungi Admin HC.
        </div>
        
        <div style="background:rgba(255,255,255,.04); border-left:3px solid rgba(14,165,233,.50); padding:12px; border-radius:6px; margin-bottom:12px;">
          <div style="font-weight:700; font-size:12px; color:rgba(255,255,255,.80); margin-bottom:6px; text-transform:uppercase; opacity:0.9;">Admin HC</div>
          <div style="font-size:13px; color:rgba(255,255,255,.85); word-break:break-all;">
            WhatsApp: <b>+62 851-7520-1627</b>

        <a href="https://wa.me/628517520162?text=Halo%20Admin%20HC%2C%20saya%20butuh%20bantuan%20dengan%20aplikasi%20HCIS" target="_blank" rel="noopener" style="display:block;">
          <button class="btn primary" style="margin-top:6px;">
            💬 Hubungi via WhatsApp
          </button>
        </a>
      </div>

      <div style="font-size:12px; color:rgba(255,255,255,.60); font-style:italic;">
        Respons biasanya dalam 1-2 jam kerja.
      </div>
    </div>
  `;

  root.innerHTML = headerHtml + contentHtml;
}

function renderSettingsAbout_(){
  const headerHtml = `
    <div class="card" style="display:flex; align-items:center; gap:10px; padding:14px; margin-bottom:0; border-bottom:1px solid rgba(255,255,255,.12); cursor:pointer;" onclick="settingsGoToMenu_('main')">
      <div style="font-size:20px;">‹</div>
      <div style="font-weight:700; font-size:16px; color:rgba(255,255,255,.95);">Tentang Aplikasi</div>
    </div>
  `;

  const contentHtml = `
    <div class="card" style="margin-top:0; border-radius:0 0 16px 16px;">
      <div style="background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:16px; text-align:center; margin-bottom:14px;">
        <div style="font-size:28px; margin-bottom:10px;">📱</div>
        <div style="font-weight:900; font-size:16px; color:rgba(255,255,255,.96); margin-bottom:6px;">HCIS Sabilul Qur'an</div>
        <div style="font-size:12px; color:rgba(255,255,255,.70);">Human Capital Information System</div>
      </div>

      <div style="margin-bottom:14px;">
        <div style="font-weight:700; font-size:12px; color:rgba(255,255,255,.75); text-transform:uppercase; margin-bottom:8px; opacity:0.9;">Tentang</div>
        <div style="font-size:13px; color:rgba(255,255,255,.85); line-height:1.6;">
          Sistem Informasi Human Capital untuk mendukung pengelolaan Sumber Daya Manusia di lingkungan Yayasan Sabilul Qur'an.
        </div>

      <div style="margin-bottom:14px; padding-top:14px; border-top:1px solid rgba(255,255,255,.10);">
        <div style="font-weight:700; font-size:12px; color:rgba(255,255,255,.75); text-transform:uppercase; margin-bottom:8px; opacity:0.9;">Developer</div>

      <div style="padding-top:14px; border-top:1px solid rgba(255,255,255,.10);">

function renderSettingsComingSoon_(menuName){
  const menuLabel = menuName === 'history' ? 'Riwayat Login' : 'Preferensi Tampilan';
  
  const headerHtml = `
    <div class="card" style="display:flex; align-items:center; gap:10px; padding:14px; margin-bottom:0; border-bottom:1px solid rgba(255,255,255,.12); cursor:pointer;" onclick="settingsGoToMenu_('main')">
      <div style="font-size:20px;">‹</div>
      <div style="font-weight:700; font-size:16px; color:rgba(255,255,255,.95);">${escapeHtml(menuLabel)}</div>
    </div>
  `;

  const contentHtml = `
    <div class="card" style="margin-top:0; border-radius:0 0 16px 16px; text-align:center; padding:32px 14px;">
      <div style="font-size:42px; margin-bottom:12px;">🚀</div>
      <div style="font-weight:700; font-size:16px; color:rgba(255,255,255,.95); margin-bottom:8px;">Segera Hadir</div>
      <div style="font-size:13px; color:rgba(255,255,255,.75); line-height:1.6;">
        Fitur ini akan tersedia pada pembaruan berikutnya.
      </div>
    </div>
  `;

  root.innerHTML = headerHtml + contentHtml;
}

function renderChangePasswordCard_(){
  const msgHtml = SETTINGS_STATE.msg
    ? `<div class="muted" style="margin:10px 0; color:${SETTINGS_STATE.msgType==='error' ? '#ffb4b4' : (SETTINGS_STATE.msgType==='success' ? '#b8ffcf' : 'rgba(255,255,255,.72)')};">
         ${escapeHtml(SETTINGS_STATE.msg)}
       </div>`
    : '';

  // Step content
  let stepHtml = '';

  if (SETTINGS_STATE.step === 1) {
    stepHtml = `
      <div class="muted" style="margin-bottom:10px;">
        Untuk mengganti password, masukkan <b>password lama</b> lalu kirim kode OTP ke No_HP.
      </div>
      <div style="margin-bottom:10px;">
        <input id="oldPass" type="password" placeholder="Password lama" autocomplete="current-password">
      </div>
      <button class="btn primary" onclick="settingsSendOTP_()">Kirim Kode Verifikasi (No_HP)</button>
    `;
  }

  if (SETTINGS_STATE.step === 2) {
    stepHtml = `
      <div class="muted" style="margin-bottom:10px;">
        Masukkan <b>OTP 6 digit</b> yang dikirim ke No_HP. Berlaku 5 menit.
      </div>
      <div style="margin-bottom:10px;">
        <input id="otp" inputmode="numeric" placeholder="OTP (6 digit)" autocomplete="one-time-code">
      </div>
      <div class="row">
        <div class="col">
          <button class="btn primary" onclick="settingsVerifyOTP_()">Verifikasi OTP</button>
        </div>
        <div class="col">
          <button class="btn" style="background:rgba(255,255,255,.10);color:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.22);" onclick="settingsBackToStep1_()">
            Kirim Ulang
          </button>
        </div>
      </div>
    `;
  }

  if (SETTINGS_STATE.step === 3) {
    stepHtml = `
      <div class="muted" style="margin-bottom:10px;">
        Password minimal <b>8 karakter</b>, mengandung <b>huruf besar</b>, <b>angka</b>, dan <b>simbol</b> (mis: ! @ #).
      </div>
      <div style="margin-bottom:10px;">
        <input id="newPass" type="password" placeholder="Password baru" autocomplete="new-password">
      </div>
      <div style="margin-bottom:10px;">
        <input id="newPass2" type="password" placeholder="Ulangi password baru" autocomplete="new-password">
      </div>
      <button class="btn primary" onclick="settingsUpdatePassword_()">Simpan Password Baru</button>
      <div class="muted" style="margin-top:10px;">
        Setelah berhasil, Anda akan otomatis logout dan diminta login ulang.
      </div>
    `;
  }

  return `
    <div class="card" style="margin-top:0; border-radius:0 0 16px 16px;">
      <div style="font-weight:900;margin-bottom:10px;">Ganti Password</div>
      ${msgHtml}
      ${stepHtml}
    </div>
  `;
}

/* ===== UI actions ===== */

function settingsGoToMenu_(menuName){
  SETTINGS_STATE.currentMenu = menuName;
  SETTINGS_STATE.step = 1;
  SETTINGS_STATE.msg = '';
  SETTINGS_STATE.msgType = 'info';
  renderSettings();
}

function settingsSetMsg_(msg, type='info'){
  SETTINGS_STATE.msg = msg || '';
  SETTINGS_STATE.msgType = type;
  renderSettingsPasswordFlow_();
}

function settingsBackToStep1_(){
  SETTINGS_STATE.step = 1;
  SETTINGS_STATE.msg = '';
  renderSettingsPasswordFlow_();
}

function settingsSendOTP_(){
  const oldPass = document.getElementById('oldPass')?.value || '';
  if (!oldPass) return settingsSetMsg_('Password lama wajib diisi.', 'error');

  settingsSetMsg_('Mengirim OTP ke No_HP…', 'info');

  google.script.run.withSuccessHandler(res=>{
    if (!res || !res.ok){
      settingsSetMsg_(res?.msg || 'Gagal mengirim OTP.', 'error');
      return;
    }
    SETTINGS_STATE.step = 2;
    SETTINGS_STATE.lastOtpSentAt = new Date();
    settingsSetMsg_(res?.msg || 'OTP terkirim. Silakan cek No_HP.', 'success');
  }).requestPasswordChange(withAuthPayload_({ oldPassword: oldPass }));
}

function settingsVerifyOTP_(){
  const otp = (document.getElementById('otp')?.value || '').trim();
  if (!otp) return settingsSetMsg_('OTP wajib diisi.', 'error');
  if (!/^\d{6}$/.test(otp)) return settingsSetMsg_('OTP harus 6 digit angka.', 'error');

  settingsSetMsg_('Memverifikasi OTP…', 'info');

  google.script.run.withSuccessHandler(res=>{
    if (!res || !res.ok){
      settingsSetMsg_(res?.msg || 'OTP tidak valid.', 'error');
      return;
    }
    SETTINGS_STATE.step = 3;
    settingsSetMsg_('OTP valid. Silakan buat password baru.', 'success');
  }).verifyPasswordOTP(withAuthPayload_({ inputOTP: otp }));
}

function settingsUpdatePassword_(){
  const p1 = document.getElementById('newPass')?.value || '';
  const p2 = document.getElementById('newPass2')?.value || '';
  if (!p1 || !p2) return settingsSetMsg_('Password baru & konfirmasi wajib diisi.', 'error');
  if (p1 !== p2) return settingsSetMsg_('Konfirmasi password tidak sama.', 'error');

  // client-side policy check (backend juga cek)
  const policyOk = (
    p1.length >= 8 &&
    /[A-Z]/.test(p1) &&
    /[0-9]/.test(p1) &&
    /[!@#$%^&*()_+\-=]/.test(p1)
  );
  if (!policyOk) {
    return settingsSetMsg_('Password belum memenuhi aturan (8+, huruf besar, angka, simbol).', 'error');
  }

  settingsSetMsg_('Menyimpan password baru…', 'info');

  google.script.run.withSuccessHandler(res=>{
    if (!res || !res.ok){
      settingsSetMsg_(res?.msg || 'Gagal mengganti password.', 'error');
      return;
    }
    settingsResetState_();
    // backend menghapus session → kita arahkan kembali ke login
    state.me = null;
    state.route = 'login';
    nav.classList.add('hidden');
    btnLogout.classList.add('hidden');
    clearStoredAuth_();
    renderLogin('Password berhasil diubah. Silakan login ulang.');
  }).updatePassword(withAuthPayload_({ newPass: p1 }));
}
</script>
